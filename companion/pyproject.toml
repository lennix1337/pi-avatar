[project]
name = "pi-avatar-companion"
version = "0.1.0"
description = "Cérebro e orquestrador do companion do Pi Avatar: conversa em pt-BR, memória, iniciativa e servidor para o pet."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
pi-companion = "companion.__main__:main"

[project.optional-dependencies]
# Voz real: `uv sync --extra voice`. O modo --text e os testes do cérebro não precisam disso.
voice = [
    "numpy",
    "scipy",
    "soundfile",
    "sounddevice",            # microfone e alto-falante (PortAudio)
    "silero-vad",             # detecção de voz (build ONNX, CPU)
    "onnxruntime",
    "faster-whisper",         # STT reserva; o Canary usa só Node + o modelo do Pi Voice
    "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'",   # 12.9.3 saiu sem wheel para Windows
    "nvidia-cudnn-cu12; sys_platform == 'win32'",
    "supertonic",             # TTS padrão (ONNX, CPU)
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["companion"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
